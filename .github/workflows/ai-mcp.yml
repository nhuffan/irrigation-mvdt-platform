name: AI + MCP checks

# Synthetic data only: no private corpus, research database, secrets or model.
on:
  push:
    branches: [main, feat/irrigation-ai-mcp]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
      STORAGE_ROOT: /nonexistent-private-storage
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - name: AI, MCP and synthetic demo corpus tests
        run: >-
          uv run python -m pytest -q
          tests/test_demo_corpus.py
          tests/test_mcp.py
          tests/test_mcp_remote.py
          tests/test_rag_lite_generation.py
          tests/test_rag_lite_citations.py
          tests/test_rag_lite_answer_policy.py
          tests/test_rag_lite_query.py
          tests/test_rag_lite_hybrid.py
      - name: Scripted grounded-answer guardrail evaluation
        run: uv run python -m scripts.evaluate_rag_generation --output "$RUNNER_TEMP/guardrails.csv"
